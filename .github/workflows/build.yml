name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Unpack project and generate Android scaffold
        run: |
          unzip -q pulse.zip
          flutter create app --project-name pulse --org com.example --platforms android
          cp pulse/src/pubspec.yaml app/pubspec.yaml
          cp pulse/src/lib/main.dart app/lib/main.dart
          cp pulse/src/MainActivity.kt app/android/app/src/main/kotlin/com/example/pulse/MainActivity.kt
          rm -rf app/test
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="Pulse"|' $M

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
